name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Test profile isolation
        run: python -m pytest -q tests/test_core.py::test_profiles_are_independent
      - name: Test workflow operations
        run: python -m pytest -q tests/test_core.py::test_workflow_and_ordering
      - name: Test dynamic chapter assembly
        run: python -m pytest -q tests/test_core.py::test_chapter_reference_resolves_without_editing_step
      - name: Test paths and JSON recovery
        run: python -m pytest -q tests/test_core.py::test_traversal_and_json_recovery
  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m PyInstaller --noconfirm --clean NovelTranslationWorkflowManager.spec
      - uses: actions/upload-artifact@v4
        with:
          name: NovelTranslationWorkflowManager-windows
          path: dist/NovelTranslationWorkflowManager.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NovelTranslationWorkflowManager.exe
