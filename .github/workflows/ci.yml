name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run desktop UI smoke test
        run: python tests/ui_smoke.py
      - name: Run test suite
        run: python -m pytest -q
  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable Windows app
        run: .\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NovelWorkflow-windows
          path: dist/NovelWorkflow-windows.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NovelWorkflow-windows.zip
