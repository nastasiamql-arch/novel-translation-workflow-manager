# NovelWorkflow CI - v1.3 release validation
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run desktop UI smoke test
        timeout-minutes: 2
        run: python tests/ui_smoke.py
      - name: Verify native Windows file clipboard
        run: python tests/windows_clipboard.py
      - name: Run DPI geometry matrix
        shell: pwsh
        run: |
          foreach ($scale in @("1.0", "1.25", "1.5", "2.0")) {
            $env:QT_SCALE_FACTOR = $scale
            python tests/ui_geometry.py
            if ($LASTEXITCODE -ne 0) { throw "UI geometry failed at scale $scale" }
          }
          Remove-Item Env:QT_SCALE_FACTOR
      - name: Run test suite
        timeout-minutes: 15
        run: python -m pytest -q --durations=10 -o faulthandler_timeout=60

  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        run: .\build_windows.ps1
      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify actual silent installer upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 5
        run: .\tests\installer_upgrade.ps1 -Version "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: NovelWorkflow-Installer-${{ steps.version.outputs.version }}
          path: |
            dist/NovelWorkflow-Setup-${{ steps.version.outputs.version }}.exe
      - name: Create version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          git fetch --tags
          $existingTag = git tag --list $tag
          if ($existingTag -contains $tag) {
            Write-Output "Tag $tag already exists; leaving it unchanged."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag "${{ github.sha }}"
            git push origin $tag
          }
      - name: Publish versioned GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NovelWorkflow v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/NovelWorkflow-Setup-${{ steps.version.outputs.version }}.exe
      - name: Verify published in-app update and in-place upgrade
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $publishedInstaller = Join-Path $env:RUNNER_TEMP "Published-Setup-${{ steps.version.outputs.version }}.exe"
          .\.venv\Scripts\python.exe tests/published_update.py "${{ steps.version.outputs.version }}" $publishedInstaller
          if ($LASTEXITCODE -ne 0) { throw "Published updater verification failed" }
          .\tests\installer_upgrade.ps1 -Version "${{ steps.version.outputs.version }}" -InstallerPath $publishedInstaller
