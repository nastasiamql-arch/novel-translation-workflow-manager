[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelworkflow"
version = "3.7.1"
description = "Windows novel translation workflow manager"
readme = "README.md"
requires-python = ">=3.10"
# Qt 6.12.0 reproducibly crashes on Windows process exit after the UI smoke
# passes (Python 3.12, access violation); keep the validated 6.11 runtime.
dependencies = ["PySide6>=6.6,<6.12", "httpx>=0.27,<1", "selectolax>=0.3.21,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
novelworkflow = "novel_workflow.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
