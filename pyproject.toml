[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelworkflow"
version = "6.7.2"
description = "Windows novel translation workflow manager"
readme = "README.md"
requires-python = ">=3.10"
# Qt 6.12.0 reproducibly crashes on Windows process exit after the UI smoke
# passes (Python 3.12, access violation); keep the validated 6.11 runtime.
dependencies = ["PySide6>=6.6,<6.12", "Send2Trash>=1.8.3,<2", "pywin32>=308; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6", "Pillow>=10"]

[project.scripts]
novelworkflow = "novel_workflow.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
